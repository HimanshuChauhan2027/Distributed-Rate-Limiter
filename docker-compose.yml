services:
  redis:
    image: redis:7-alpine
    container_name: rl-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend-1:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rl-backend-1
    environment:
      INSTANCE_ID: backend-1
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_ALGORITHM: ${RATE_LIMIT_ALGORITHM:-FIXED_WINDOW}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-10}
      RATE_LIMIT_REFILL_PER_SEC: ${RATE_LIMIT_REFILL_PER_SEC:-1.0}
      REDIS_FAILURE_MODE: ${REDIS_FAILURE_MODE:-fail_open}
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy

  backend-2:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rl-backend-2
    environment:
      INSTANCE_ID: backend-2
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_ALGORITHM: ${RATE_LIMIT_ALGORITHM:-FIXED_WINDOW}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-10}
      RATE_LIMIT_REFILL_PER_SEC: ${RATE_LIMIT_REFILL_PER_SEC:-1.0}
      REDIS_FAILURE_MODE: ${REDIS_FAILURE_MODE:-fail_open}
    ports:
      - "8082:8080"
    depends_on:
      redis:
        condition: service_healthy

  backend-3:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rl-backend-3
    environment:
      INSTANCE_ID: backend-3
      PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RATE_LIMIT_ALGORITHM: ${RATE_LIMIT_ALGORITHM:-FIXED_WINDOW}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-10}
      RATE_LIMIT_REFILL_PER_SEC: ${RATE_LIMIT_REFILL_PER_SEC:-1.0}
      REDIS_FAILURE_MODE: ${REDIS_FAILURE_MODE:-fail_open}
    ports:
      - "8083:8080"
    depends_on:
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: rl-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: rl-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  grafana:
    image: grafana/grafana:11.1.0
    container_name: rl-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
