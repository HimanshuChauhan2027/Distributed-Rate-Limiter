worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend_pool {
        server backend-1:8080 max_fails=3 fail_timeout=10s;
        server backend-2:8080 max_fails=3 fail_timeout=10s;
        server backend-3:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;

            add_header Access-Control-Expose-Headers "X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, X-Backend-Instance, X-RateLimit-Degraded" always;
        }

        location /health {
            proxy_pass http://backend_pool/health;
        }

        location /metrics {
            proxy_pass http://backend_pool/metrics;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        # Per-backend health checks for the dashboard
        location /health/backend-1 {
            proxy_pass http://backend-1:8080/health;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }

        location /health/backend-2 {
            proxy_pass http://backend-2:8080/health;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }

        location /health/backend-3 {
            proxy_pass http://backend-3:8080/health;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
        }
    }
}
